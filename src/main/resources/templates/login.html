<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/styleMainPage.css}"/>
</head>
<body>
<div class="auth-box">
    <h2>Sign In</h2>
    <form th:action="@{/auth/login}" method="post">
        <label>
            <input type="text" name="username" placeholder="Username" required/>
        </label>
        <label>
            <input type="password" name="password" placeholder="Password" required/>
        </label>
        <button type="submit">Login</button>
    </form>
    <div class="switch">
        <span>Need an account? <a th:href="@{/auth/register}">Sign Up</a></span>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <style>
        body {
            font-family: monospace, sans-serif;
            background-color: #2b2b2b;
            color: #ddd;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .auth-box {
            background-color: #3c3f41;
            border: 1px solid #4e5254;
            padding: 2rem;
            border-radius: 12px;
            width: 350px;
            box-shadow: 0 0 15px rgba(0,0,0,0.6);
        }
        h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #fff;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 1rem;
            border: 1px solid #555;
            border-radius: 6px;
            background-color: #2b2b2b;
            color: #fff;
        }
        input:focus {
            border-color: #007acc;
            outline: none;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007acc;
            border: none;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0098ff;
        }
        .switch {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
        }
        .switch a {
            color: #aaa;
            text-decoration: none;
        }
        .switch a:hover {
            color: #fff;
        }
    </style>
</head>
<body>
<div class="auth-box">
    <h2>Sign Up</h2>
    <form th:action="@{/auth/register}" method="post">
        <input type="text" name="username" placeholder="Username" required/>
        <input type="email" name="email" placeholder="Email" required/>
        <input type="password" name="password" placeholder="Password" required/>
        <button type="submit">Register</button>
    </form>
    <div class="switch">
        <span>Already have an account? <a th:href="@{/auth/login}">Sign In</a></span>
    </div>
</div>
</body>
</html>

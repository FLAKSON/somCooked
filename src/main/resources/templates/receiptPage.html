<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Recipes</title>
    <link rel="stylesheet" th:href="@{/css/styleMainPage.css}"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .recipes-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .recipes-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .recipes-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--primary);
            margin: 0;
        }

        .create-recipe-btn {
            background: linear-gradient(90deg, var(--secondary), var(--accent));
            color: var(--white);
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .create-recipe-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 127, 80, 0.4);
        }

        .recipes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .recipe-card {
            background: var(--white);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            position: relative;
        }

        .recipe-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }

        .recipe-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: linear-gradient(135deg, var(--primary-light), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3rem;
        }

        .recipe-content {
            padding: 1.5rem;
        }

        .recipe-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: var(--dark);
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .recipe-description {
            color: var(--gray);
            margin-bottom: 1rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 4.5em;
        }

        .recipe-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            color: var(--gray);
        }

        .recipe-actions {
            display: flex;
            gap: 0.5rem;
        }

        .recipe-btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: var(--transition);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .view-btn {
            background: var(--primary);
            color: var(--white);
        }

        .edit-btn {
            background: var(--accent);
            color: var(--white);
        }

        .delete-btn {
            background: #ff4757;
            color: var(--white);
        }

        .recipe-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--gray);
        }

        .empty-state i {
            font-size: 4rem;
            color: var(--primary-light);
            margin-bottom: 1.5rem;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--dark);
        }

        .public-badge {
            background: var(--accent);
            color: white;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.8rem;
        }

        .private-badge {
            background: var(--gray);
            color: white;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.8rem;
        }

        @media (max-width: 768px) {
            .recipes-grid {
                grid-template-columns: 1fr;
            }

            .recipes-header {
                flex-direction: column;
                text-align: center;
            }

            .recipe-actions {
                flex-direction: column;
            }

            .recipe-btn {
                text-align: center;
            }
        }
    </style>
</head>
<body>
<header class="header">
    <h1 class="welcome-title">Som<span>Cooked</span></h1>
    <nav class="nav">
        <a th:href="@{/main/home}"><i class="fas fa-home"></i> Home</a>
        <a th:href="@{/recipe/all}"><i class="fas fa-globe"></i>All Recipes</a>
        <a th:href="@{/recipe/new}"><i class="fas fa-plus-circle"></i>Add Recipe</a>
        <a th:href="@{/logout}"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </nav>
</header>

<div class="recipes-container">
    <div class="recipes-header">
        <h1 class="recipes-title">My Recipes</h1>
        <a th:href="@{/recipe/new}" class="create-recipe-btn">
            <i class="fas fa-plus"></i> Create Recipe
        </a>
    </div>

    <!-- Success Messages -->
    <div th:if="${param.success != null}" class="success-message" style="background: #d4edda; color: #155724; padding: 1rem; border-radius: 8px; margin-bottom: 2rem;">
        <i class="fas fa-check-circle"></i> Recipe created successfully!
    </div>

    <!-- If no recipes -->
    <div th:if="${recipes != null and recipes.empty}" class="empty-state">
        <i class="fas fa-book-open"></i>
        <h3>No recipes yet</h3>
        <p>Create your first recipe and share it with the world!</p>
        <a th:href="@{/recipe/new}" class="cta-button" style="margin-top: 1rem;">
            <i class="fas fa-plus"></i> Create First Recipe
        </a>
    </div>

    <!-- Recipes Grid -->
    <div th:unless="${recipes == null or recipes.empty}" class="recipes-grid">
        <div th:each="recipe : ${recipes}" class="recipe-card">
            <!-- Recipe Image Placeholder -->
            <div class="recipe-image">
                <i class="fas fa-utensils"></i>
            </div>

            <div class="recipe-content">
                <!-- Title and Status -->
                <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 0.5rem;">
                    <h3 class="recipe-title" th:text="${recipe.title}">Recipe Title</h3>
                    <span th:if="${recipe.publicFlag}" class="public-badge">
                            <i class="fas fa-globe"></i> Public
                        </span>
                    <span th:unless="${recipe.publicFlag}" class="private-badge">
                            <i class="fas fa-lock"></i> Private
                        </span>
                </div>

                <!-- Description -->
                <p class="recipe-description" th:text="${recipe.description != null} ? ${recipe.description} : 'No description provided'">
                    Recipe description...
                </p>

                <!-- Meta Information -->
                <div class="recipe-meta">
                    <div class="recipe-author">
                        <i class="fas fa-calendar"></i>
                        <span th:text="${recipe.creationDate}">Creation Date</span>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="recipe-actions">
                    <a th:href="@{/recipe/{id}(id=${recipe.id})}" class="recipe-btn view-btn">
                        <i class="fas fa-eye"></i> View
                    </a>
                    <a th:href="@{'/recipe/edit/' + ${recipe.id}}" class="recipe-btn edit-btn">
                        <i class="fas fa-edit"></i> Edit
                    </a>
                    <form th:action="@{'/recipe/delete/' + ${recipe.id}}" method="post" style="display:inline;">
                        <input type="hidden" name="_method" value="DELETE"/>
                        <button type="submit" class="recipe-btn delete-btn"
                                onclick="return confirm('Are you sure you want to delete this recipe?')">
                            <i class="fas fa-trash"></i> Delete
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Font Awesome for icons -->
<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${recipe.title}">Recipe Title - SomCooked</title>
    <link rel="stylesheet" th:href="@{/css/styleMainPage.css}"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- Общие стили --- */
        :root {
            --primary: #6a5acd;
            --primary-light: #9b85e3;
            --accent: #ff7f50;
            --secondary: #ff6347;
            --gray: #777;
            --white: #fff;
            --dark: #333;
            --shadow: 0 4px 8px rgba(0,0,0,0.1);
            --transition: 0.3s ease;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }

        header.header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: var(--primary);
            color: var(--white);
        }

        .welcome-title span {
            color: var(--accent);
        }

        nav.nav a {
            color: var(--white);
            text-decoration: none;
            margin-left: 1.5rem;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        nav.nav a:hover {
            text-decoration: underline;
        }

        /* --- Контейнер рецепта --- */
        .recipe-detail-container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .recipe-header {
            text-align: center;
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 2px solid rgba(106, 90, 205, 0.1);
        }

        .recipe-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            color: var(--primary);
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .recipe-meta {
            display: flex;
            justify-content: center;
            gap: 2rem;
            color: var(--gray);
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .recipe-status {
            background: var(--accent);
            color: white;
            padding: 0.3rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .recipe-image {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 2rem;
            background: linear-gradient(135deg, var(--primary-light), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 4rem;
        }

        .recipe-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            margin-bottom: 3rem;
        }

        @media (max-width: 768px) {
            .recipe-content {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
        }

        .content-section, .description-section {
            background: var(--white);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: var(--shadow);
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid rgba(106, 90, 205, 0.2);
            display: flex;
            align-items: center;
            gap: 0.7rem;
        }

        .ingredients-list, .steps-list {
            list-style: none;
            padding: 0;
        }

        .ingredient-item {
            padding: 0.8rem 0;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .ingredient-item:last-child {
            border-bottom: none;
        }

        .ingredient-item::before {
            content: "•";
            color: var(--secondary);
            font-size: 1.5rem;
        }

        .step-item {
            padding: 1.2rem 0 1.2rem 1rem;
            border-left: 3px solid var(--accent);
            margin-bottom: 1rem;
            position: relative;
            counter-increment: step-counter;
        }

        .steps-list {
            counter-reset: step-counter;
        }

        .step-item::before {
            content: counter(step-counter);
            background: var(--primary);
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            left: -15px;
            top: 1rem;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .description-text {
            line-height: 1.8;
            color: var(--dark);
            font-size: 1.1rem;
        }

        .recipe-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 2px solid rgba(106, 90, 205, 0.1);
        }

        .action-btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
        }

        .back-btn { background: var(--gray); color: var(--white); }
        .edit-btn { background: var(--accent); color: var(--white); }
        .delete-btn { background: #ff4757; color: var(--white); }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        @media (max-width: 600px) {
            .recipe-title { font-size: 2.2rem; }
            .recipe-meta { flex-direction: column; gap: 0.5rem; }
            .recipe-actions { flex-direction: column; align-items: center; }
            .action-btn { width: 200px; justify-content: center; }
        }
    </style>
</head>
<body>
<header class="header">
    <h1 class="welcome-title">Som<span>Cooked</span></h1>
    <nav class="nav">
        <a th:href="@{/main/home}"><i class="fas fa-home"></i> Home</a>
        <a th:href="@{/recipes}"><i class="fas fa-globe"></i>All Recipes</a>
        <a th:href="@{/recipe/new}"><i class="fas fa-plus"></i> Create Recipe</a>
        <a th:href="@{/auth/logout}"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </nav>
</header>

<main class="recipe-detail-container">
    <!-- Recipe Header -->
    <section class="recipe-header">
        <h1 class="recipe-title" th:text="${recipe.title}">Recipe Title</h1>

        <div class="recipe-meta">
            <div class="meta-item">
                <i class="fas fa-user"></i>
                <span th:text="${recipe.user != null && recipe.user.username != null} ? ${recipe.user.username} : 'You'">Author</span>
            </div>
            <div class="meta-item">
                <i class="fas fa-calendar"></i>
                <span th:text="${recipe.creationDate}">Creation Date</span>
            </div>
            <div class="meta-item">
                <i class="fas fa-clock"></i>
                <span th:text="${#strings.arraySplit(recipe.steps, '\n').length} + ' steps'">0 steps</span>
            </div>
        </div>

        <div class="recipe-status">
            <i class="fas" th:classappend="${recipe.publicFlag} ? 'fa-globe' : 'fa-lock'"></i>
            <span th:text="${recipe.publicFlag} ? 'Public Recipe' : 'Private Recipe'">Status</span>
        </div>
    </section>

    <!-- Recipe Image -->
    <div class="recipe-image">
        <i class="fas fa-utensils"></i>
    </div>

    <!-- Description -->
    <section class="description-section" th:if="${recipe.description != null && !recipe.description.isEmpty()}">
        <h2 class="section-title"><i class="fas fa-file-alt"></i> Description</h2>
        <p class="description-text" th:text="${recipe.description}">Recipe description...</p>
    </section>

    <!-- Ingredients & Steps -->
    <div class="recipe-content">
        <section class="content-section">
            <h2 class="section-title"><i class="fas fa-list"></i> Ingredients</h2>
            <ul class="ingredients-list">
                <li th:each="ingredient : ${#strings.arraySplit(recipe.ingredients, '\n')}"
                    th:if="${!ingredient.isEmpty()}" class="ingredient-item"
                    th:text="${ingredient}">Ingredient</li>
            </ul>
        </section>

        <section class="content-section">
            <h2 class="section-title"><i class="fas fa-list-ol"></i> Cooking Steps</h2>
            <ol class="steps-list">
                <li th:each="step : ${#strings.arraySplit(recipe.steps, '\n')}"
                    th:if="${!step.isEmpty()}" class="step-item"
                    th:text="${step}">Step description...</li>
            </ol>
        </section>
    </div>

    <!-- Actions -->
    <div class="recipe-actions">
        <a th:href="@{/recipe/myReceipt}" class="action-btn back-btn"><i class="fas fa-arrow-left"></i> Back to Recipes</a>
        <a th:href="@{'/recipe/edit/' + ${recipe.id}}" class="action-btn edit-btn"><i class="fas fa-edit"></i> Edit Recipe</a>
        <form th:action="@{'/recipe/delete/' + ${recipe.id}}" method="post" style="display:inline;">
            <input type="hidden" name="_method" value="DELETE"/>
            <button type="submit" class="action-btn delete-btn" onclick="return confirm('Are you sure you want to delete this recipe?')">
                <i class="fas fa-trash"></i> Delete Recipe
            </button>
        </form>
    </div>
</main>

<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${recipe.title}">Recipe Title - SomCooked</title>
    <link rel="stylesheet" th:href="@{/css/styleMainPage.css}"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .recipe-actions{display:flex;gap:1.5rem;justify-content:center;margin-top:3rem;padding-top:2rem;border-top:2px solid rgba(106,90,205,.1);flex-wrap:wrap}
        .action-btn{padding:.9rem 2rem;border:none;border-radius:50px;font-weight:600;font-size:1.05rem;cursor:pointer;display:inline-flex;align-items:center;gap:.6rem;transition:.3s;color:#fff;text-decoration:none;position:relative;overflow:hidden}
        .back-btn{background:linear-gradient(135deg,#6c757d,#495057)}
        .edit-btn{background:linear-gradient(135deg,#ff7f50,#ff6347)}
        .delete-btn{background:linear-gradient(135deg,#ff4757,#e84118)}
        .action-btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 6px 18px rgba(0,0,0,.2)}
        .action-btn i{font-size:1.1rem;transition:.3s}
        .action-btn:hover i{transform:rotate(-12deg) scale(1.2)}
        .recipe-detail-container{max-width:1200px;margin:2rem auto;padding:0 1.5rem}
        .recipe-header{text-align:center;margin-bottom:3rem;padding-bottom:2rem;border-bottom:2px solid rgba(106,90,205,.1)}
        .recipe-title{font-family:'Playfair Display',serif;font-size:2.8rem;color:var(--primary);margin-bottom:1rem;line-height:1.2}
        .recipe-meta{display:flex;justify-content:center;gap:2rem;color:var(--gray);margin-bottom:1.5rem;flex-wrap:wrap}
        .recipe-image{width:100%;height:300px;object-fit:cover;border-radius:15px;margin-bottom:2rem;background:linear-gradient(135deg,var(--primary-light),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;font-size:4rem}
        .description-section{background:var(--white);padding:2rem;border-radius:15px;box-shadow:var(--shadow);margin-bottom:2rem}
        .recipe-content{display:grid;grid-template-columns:2.5fr 3fr;gap:2rem;align-items:start;margin-bottom:3rem}
        .content-section{background:var(--white);padding:2rem;border-radius:15px;box-shadow:var(--shadow);min-height:300px;border-left:6px solid;border-image:linear-gradient(to bottom,var(--primary),var(--accent)) 1;transition:.3s}
        .content-section:hover{transform:translateY(-5px);box-shadow:0 8px 20px rgba(106,90,205,.2)}
        .section-title{font-family:'Playfair Display',serif;font-size:1.5rem;background:linear-gradient(90deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:1.5rem;padding-bottom:.5rem;border-bottom:2px solid rgba(106,90,205,.2);display:flex;align-items:center;gap:.7rem}
        .ingredients-list{width:100%;padding:0;margin:0;list-style:none}
        .ingredients-list li{display:grid;grid-template-columns:2fr 1fr;gap:1rem;padding:.8rem 1rem;border-bottom:1px solid #f0f0f0;border-radius:6px;font-size:1.05rem;transition:.3s}
        .ingredients-list li:hover{background:linear-gradient(90deg,rgba(106,90,205,.08),rgba(255,127,80,.08))}
        .ingredients-list li:last-child{border-bottom:none}
        .steps-list{list-style:decimal inside;padding-left:1rem}
        .steps-list li{margin-bottom:1rem;line-height:1.6;border-radius:6px;padding:.6rem;transition:.3s}
        .steps-list li:hover{background:linear-gradient(90deg,rgba(255,127,80,.1),rgba(106,90,205,.1))}
        @media (max-width:768px){.recipe-content{grid-template-columns:1fr}}
    </style>
</head>
<body>
<header class="header">
    <h1 class="welcome-title">Som<span>Cooked</span></h1>
    <nav class="nav">
        <a th:href="@{/main/home}"><i class="fas fa-home"></i> Home</a>
        <a th:href="@{/recipes}"><i class="fas fa-globe"></i>All Recipes</a>
        <a th:href="@{/recipe/new}"><i class="fas fa-plus"></i> Create Recipe</a>
        <a th:href="@{/logout}"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </nav>
</header>

<main class="recipe-detail-container">
    <section class="recipe-header">
        <h1 class="recipe-title" th:text="${recipe.title}">Recipe Title</h1>

        <div class="recipe-meta">
            <div class="meta-item">
                <i class="fas fa-user"></i>
                <span th:text="${(recipe.user != null and recipe.user.username != null) ? recipe.user.username : 'You'}">Author</span>
            </div>
            <div class="meta-item">
                <i class="fas fa-calendar"></i>
                <span th:text="${recipe.creationDate}">Creation Date</span>
            </div>
        </div>

        <div class="recipe-status">
            <i class="fas" th:classappend="${recipe.publicFlag} ? 'fa-globe' : 'fa-lock'"></i>
            <span th:text="${recipe.publicFlag} ? 'Public Recipe' : 'Private Recipe'">Status</span>
        </div>
    </section>

    <div class="recipe-image">
        <i class="fas fa-utensils"></i>
    </div>

    <section class="description-section" th:if="${recipe.description != null and !recipe.description.isEmpty()}">
        <h2 class="section-title"><i class="fas fa-file-alt"></i> Description</h2>
        <p class="description-text" th:text="${recipe.description}">Recipe description...</p>
    </section>

    <div class="recipe-content">
        <section class="content-section">
            <h2 class="section-title"><i class="fas fa-list"></i> Ingredients</h2>
            <ul class="ingredients-list">
                <li th:each="ingredient : ${#strings.arraySplit(recipe.ingredients, '\n')}"
                    th:if="${!ingredient.isEmpty()}"
                    th:text="${ingredient}">Ingredient - 250g</li>
            </ul>
        </section>

        <section class="content-section">
            <h2 class="section-title"><i class="fas fa-list-ol"></i> Cooking Steps</h2>
            <ul class="steps-list">
                <li th:each="step : ${#strings.arraySplit(recipe.steps, '\n')}"
                    th:if="${!step.isEmpty()}"
                    th:text="${step}">Step description...</li>
            </ul>
        </section>
    </div>

    <!-- Кнопки действий -->
    <div class="recipe-actions">
        <!-- Всегда видна -->
        <a th:href="@{/recipe/myReceipt}" class="action-btn back-btn">
            <i class="fas fa-arrow-left"></i> Back to Recipes
        </a>

        <!-- Видно ТОЛЬКО владельцу -->
        <a th:href="@{'/recipe/edit/' + ${recipe.id}}"
           class="action-btn edit-btn"
           sec:authorize="isAuthenticated() and #authentication.name == #vars.recipe?.user?.username">
            <i class="fas fa-edit"></i> Edit Recipe
        </a>

        <!-- Видно ТОЛЬКО владельцу -->
        <form th:action="@{'/recipe/delete/' + ${recipe.id}}"
              method="post"
              style="display:inline;"
              sec:authorize="isAuthenticated() and #authentication.name == #vars.recipe?.user?.username">
            <input type="hidden" name="_method" value="DELETE"/>

            <!-- CSRF добавляем только если объект доступен -->
            <th:block th:if="${_csrf != null}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            </th:block>

            <button type="submit" class="action-btn delete-btn"
                    onclick="return confirm('Are you sure you want to delete this recipe?')">
                <i class="fas fa-trash"></i> Delete Recipe
            </button>
        </form>
    </div>
</main>

<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</body>
</html>
